<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Streamer</title>
  <link rel="stylesheet" href="streamer.css" />
</head>
<body>
  <video id="localVideo" autoplay playsinline muted></video>

  <div class="streamer-overlay-top">
    <div id="streamIdText" class="streamer-id"></div>
    <div id="streamModeText" class="streamer-mode"></div>
  </div>

  <button
    type="button"
    id="flipCameraBtn"
    class="streamer-flip-btn"
    hidden
    aria-label="Switch camera"
    title="Switch camera"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
      <path
        fill="currentColor"
        d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-5.59 10.59L11 14.17V9.83l3.41 2.42-1.41 1.41-1.41-1.41 1.41-1.41 1.41 1.41zM9 12c0-1.66 1.34-3 3-3 .46 0 .89.1 1.28.28l1.43-1.43A4.984 4.984 0 0 0 12 7c-2.76 0-5 2.24-5 5h2zm6 0c0 1.66-1.34 3-3 3-.46 0-.89-.1-1.28-.28l-1.43 1.43A4.984 4.984 0 0 0 12 17c2.76 0 5-2.24 5-5h-2z"
      />
    </svg>
  </button>

  <div class="streamer-overlay-bottom">
    <button type="button" id="startBtn" class="streamer-btn streamer-btn--start streamer-btn--active">
      Start stream
    </button>
    <button type="button" id="stopBtn" class="streamer-btn streamer-btn--stop" disabled>
      Stop stream
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="streamer.js"></script>
</body>
</html>
