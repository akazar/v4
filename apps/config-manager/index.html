<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Manager — Vision v4</title>
    <link rel="stylesheet" href="/ui-kit/ui-kit.css">
    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="/shell/shell.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Config Manager</h1>
            <p class="subtitle">List and manage configurations in <code>config/public</code></p>
        </header>

        <div id="status" class="status" aria-live="polite"></div>
        <div id="listContainer" class="list-container">
            <ul id="configList" class="config-list"></ul>
        </div>

        <div id="viewPanel" class="view-panel" hidden aria-hidden="true">
            <div class="view-panel__backdrop" aria-hidden="true"></div>
            <div class="view-panel__sheet" role="dialog" aria-modal="true" aria-labelledby="viewPanelTitle">
                <header class="view-panel__header">
                    <h2 id="viewPanelTitle" class="view-panel__title">Configuration</h2>
                    <button type="button" class="view-panel__close" id="viewPanelClose" aria-label="Close">
                        <svg class="view-panel__close-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                            <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </header>
                <div class="view-panel__body">
                    <pre class="view-panel__pre" tabindex="0"><code id="viewPanelCode"></code></pre>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>

    <script type="module" src="/shell/shell.js"></script>
</body>
</html>
