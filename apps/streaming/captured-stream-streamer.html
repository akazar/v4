<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web capture streamer</title>
  <link rel="stylesheet" href="/ui-kit/ui-kit.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Web capture streamer</h1>
    <div class="info">
      <div><strong>Stream ID:</strong> <span id="streamIdText"></span></div>
      <div><strong>Streaming mode:</strong> <span id="streamModeText"></span></div>
      <div id="sourceInfo"></div>
      <div class="status" id="status">Initializing...</div>
    </div>

    <canvas id="captureCanvas" class="capture-stream-canvas" width="640" height="360"></canvas>

    <div class="row" style="margin-top: 1rem;">
      <button id="startBtn">Start web capture</button>
      <button id="stopBtn" disabled>Stop stream</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="captured-stream-streamer.js" type="module"></script>
</body>
</html>
