<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home - Multi Stream WebRTC</title>
  <link rel="stylesheet" href="/ui-kit/ui-kit.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Multi-stream WebRTC Home</h1>

    <div class="panel">
      <h2>Create a new streamer</h2>
      <div class="row" style="margin-bottom: 0.5rem;">
        <label for="sourceNameInput">Stream Name</label>
        <input id="sourceNameInput" type="text" placeholder="Enter stream name" />
      </div>
      <div class="home-source-tabs">
        <div class="home-source-tablist row" role="tablist" aria-label="Stream source">
          <button type="button" class="home-source-tab active" role="tab" aria-selected="true" id="tab-source-camera" aria-controls="panel-source-camera" data-home-source-tab="camera">
            Local camera
          </button>
          <button type="button" class="home-source-tab" role="tab" aria-selected="false" id="tab-source-m3u8" aria-controls="panel-source-m3u8" data-home-source-tab="m3u8">
            M3U8 URL
          </button>
        </div>
        <div id="panel-source-camera" class="home-source-panel" role="tabpanel" aria-labelledby="tab-source-camera">
          <div class="row stream-mode-row" style="margin-top: 0.5rem;">
            <span class="stream-mode-label">Streaming type:</span>
            <label class="stream-mode-option">
              <input type="radio" name="streamModeChoice" value="p2p" checked />
              Peer-to-peer WebRTC
            </label>
            <label class="stream-mode-option">
              <input type="radio" name="streamModeChoice" value="sfu" />
              WebRTC server streaming
            </label>
          </div>
        </div>
        <div id="panel-source-m3u8" class="home-source-panel" role="tabpanel" aria-labelledby="tab-source-m3u8" hidden>
          <div class="row" style="margin-top: 0.5rem;">
            <input id="sourceUrlInput" type="url" placeholder="https://example.com/playlist.m3u8" />
          </div>
        </div>
      </div>
      <div class="row" style="margin-top: 0.75rem;">
        <button id="openStreamerBtn">Create streamer</button>
      </div>
      <div class="status" id="createStatus"></div>
    </div>

    <div class="panel">
      <h2>Available streams</h2>
      <div class="row">
        <button id="selectAllBtn">Select all</button>
        <button id="refreshBtn">Clear selections</button>
        <button id="openViewerBtn">Open viewer for selected streams</button>
        <button id="openViewerDashboardBtn">Open viewer dashboard</button>
      </div>

      <div id="streamsContainer" class="streams-list"></div>
      <div class="status" id="viewerStatus"></div>
    </div>
  </div>

  <div id="qrModal" class="qr-modal hidden">
    <div class="qr-modal-backdrop"></div>
    <div class="qr-modal-box">
      <button id="qrModalClose" class="qr-modal-close" aria-label="Close">&#x2715;</button>
      <p id="qrModalLabel" class="qr-modal-label"></p>
      <div id="qrModalCanvas"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="home.js"></script>
</body>
</html>
